name: Validate ZGrab2 configurations

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 06:00 UTC. Catches breakage introduced by upstream ZGrab2
    # changes even when this repository has had no activity.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  lint:
    name: Repository conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Enforce repository conventions
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          note() { echo "FAIL: $*"; fail=1; }

          probe_files=$(find service-discovery vulnerabilities -type f -name '*.ini')

          # 1. No em-dash, unicode arrows, or curly quotes in docs or configs.
          if grep -rnP '\x{2014}|\x{2192}|\x{201C}|\x{201D}|\x{2018}|\x{2019}' \
               README.md CONTRIBUTING.md base-configurations service-discovery vulnerabilities; then
            note "em-dash, unicode arrow, or curly quote found (use a plain hyphen / straight quote)"
          fi

          # 2. Every service-discovery / vulnerabilities config starts with a # comment block.
          for f in $probe_files; do
            head -n1 "$f" | grep -q '^#' || note "$f: missing leading comment block"
          done

          # 3. name= is lowercase, digits, and hyphens only (no spaces or capitals).
          for f in $probe_files; do
            grep -E '^name=' "$f" | grep -qvE '^name="[a-z0-9-]+"$' && note "$f: name= must be lowercase-hyphen"
          done

          # 4. name= is unique across all probe configs.
          dupes=$(grep -h '^name=' $probe_files | sort | uniq -d)
          [ -n "$dupes" ] && note "duplicate name= values: $dupes"

          # 5. Every exploitation config names its CVE on the first line.
          for f in vulnerabilities/exploitation/*.ini; do
            head -n1 "$f" | grep -qE '^# CVE-[0-9]{4}-[0-9]+' || note "$f: first line must name a CVE"
          done

          if [ "$fail" -ne 0 ]; then
            echo "Repository convention checks failed."
            exit 1
          fi
          echo "All repository convention checks passed."

  validate:
    name: Parse every configuration with upstream ZGrab2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build upstream ZGrab2
        env:
          ZGRAB2_SOURCE: ${{ runner.temp }}/zgrab2-source
        run: |
          git clone --depth 1 https://github.com/zmap/zgrab2.git "$ZGRAB2_SOURCE"
          (
            cd "$ZGRAB2_SOURCE"
            go build -trimpath -o "${RUNNER_TEMP}/zgrab2" ./cmd/zgrab2
          )

      - name: Validate all INI files
        id: validate
        env:
          ZGRAB2: ${{ runner.temp }}/zgrab2
          REPORT_DIR: ${{ runner.temp }}/zgrab2-config-validation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$REPORT_DIR"
          records="$REPORT_DIR/records.ndjson"
          tsv="$REPORT_DIR/zgrab2-config-validation.tsv"
          printf 'path\tstatus\texit_code\tmessage\n' > "$tsv"
          : > "$records"

          accepted=0
          rejected=0
          while IFS= read -r -d '' config_file; do
            relative_path=${config_file#"$GITHUB_WORKSPACE"/}
            stderr_file=$(mktemp)

            set +e
            case "$relative_path" in
              *trigger-on-port.ini)
                printf '127.0.0.1,,80\n' | timeout 5s "$ZGRAB2" -s 1 -b /dev/null multiple \
                  -c "$config_file" -o /dev/null -l /dev/null -m /dev/null \
                  >/dev/null 2>"$stderr_file"
                ;;
              *)
                printf '127.0.0.1\n' | timeout 5s "$ZGRAB2" -s 1 -b /dev/null multiple \
                  -c "$config_file" -o /dev/null -l /dev/null -m /dev/null \
                  >/dev/null 2>"$stderr_file"
                ;;
            esac
            exit_code=$?
            set -e

            message=$(tr '\n' ' ' < "$stderr_file" | sed 's/[[:space:]][[:space:]]*/ /g; s/^ //; s/ $//')
            rm -f "$stderr_file"
            if [[ "$exit_code" -eq 0 ]]; then
              status=accepted
              ((accepted += 1))
            else
              status=rejected
              ((rejected += 1))
            fi

            printf '%s\t%s\t%s\t%s\n' "$relative_path" "$status" "$exit_code" "$message" >> "$tsv"
            jq -cn \
              --arg path "$relative_path" \
              --arg status "$status" \
              --arg message "$message" \
              --argjson exit_code "$exit_code" \
              '{path: $path, status: $status, exit_code: $exit_code, message: $message}' \
              >> "$records"
          done < <(find base-configurations service-discovery vulnerabilities -type f -name '*.ini' -print0 | sort -z)

          total=$((accepted + rejected))
          jq -s \
            --argjson accepted "$accepted" \
            --argjson rejected "$rejected" \
            --argjson total "$total" \
            '{summary: {total: $total, accepted: $accepted, rejected: $rejected}, results: .}' \
            "$records" > "$REPORT_DIR/zgrab2-config-validation.json"

          echo "Validated $total configs: $accepted accepted, $rejected rejected."
          if [[ "$rejected" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zgrab2-config-validation
          path: ${{ runner.temp }}/zgrab2-config-validation/
          if-no-files-found: error
