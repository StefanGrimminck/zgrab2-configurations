# Exposed AWS CLI configuration. A 200 with "[default]" or "[profile ...]"
# sections shows regions, role ARNs and SSO settings, and at times access keys.
[http]
name="aws-config-exposure"
port=80
endpoint="/.aws/config"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
