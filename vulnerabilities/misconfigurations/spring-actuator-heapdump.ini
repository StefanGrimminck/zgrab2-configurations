# Exposed Spring Boot Actuator /heapdump endpoint. It serves a full JVM heap dump as a
# binary download, from which credentials and session data can be extracted offline.
# Probed alongside /actuator/env in our telemetry.
[http]
name="spring-actuator-heapdump"
port=8080
endpoint="/actuator/heapdump"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
