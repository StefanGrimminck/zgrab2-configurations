# Exposed phpinfo(). A leftover /phpinfo.php dumps the full PHP configuration, loaded
# modules, environment variables and absolute paths, a rich reconnaissance source.
[http]
name="phpinfo-exposure"
port=80
endpoint="/phpinfo.php"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (string) HTTP request method type
; method=GET
