# Exposed s3cmd configuration. A 200 with "access_key =" and "secret_key ="
# lines hands over S3 credentials.
[http]
name="s3cfg-exposure"
port=80
endpoint="/.s3cfg"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
