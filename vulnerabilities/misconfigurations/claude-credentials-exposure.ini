# Exposed Claude Code credentials file. A 200 JSON body with a "claudeAiOauth"
# object holds the access and refresh tokens of the account.
[http]
name="claude-credentials-exposure"
port=80
endpoint="/.claude/.credentials.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
