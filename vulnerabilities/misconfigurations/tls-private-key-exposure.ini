# Exposed TLS private key. A 200 whose body starts with "-----BEGIN PRIVATE
# KEY-----" or "-----BEGIN RSA PRIVATE KEY-----" lets anyone impersonate the
# server.
[http]
name="tls-private-key-exposure"
port=80
endpoint="/server.key"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
