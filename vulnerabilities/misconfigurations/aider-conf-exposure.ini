# Exposed Aider configuration. A 200 YAML body with keys such as
# "openai-api-key", "anthropic-api-key" or "model" is a hit.
[http]
name="aider-conf-exposure"
port=80
endpoint="/.aider.conf.yml"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
