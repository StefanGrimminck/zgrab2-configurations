# Technicolor DOCSIS cable modem / gateway. /Docsis_system.asp is the
# device's built-in status page and fingerprints the modem's web interface, a
# common consumer-CPE exposure. Technicolor/DOCSIS status markup in the
# response confirms a hit.
[http]
name="technicolor-modem"
port=8080
endpoint="/Docsis_system.asp"

# (int) Max kilobytes of response body to read
max-size=16
