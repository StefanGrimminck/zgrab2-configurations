# Exposed LiteLLM proxy configuration. A 200 YAML body with a "model_list"
# whose entries carry "litellm_params" holds the provider API keys, and
# "general_settings" may hold the proxy master key.
[http]
name="litellm-config-exposure"
port=80
endpoint="/litellm_config.yaml"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
