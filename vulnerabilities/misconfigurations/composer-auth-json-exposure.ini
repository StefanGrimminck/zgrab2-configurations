# Exposed Composer auth.json. It stores credentials for private package
# repositories. A 200 JSON body with "http-basic", "github-oauth" or "bearer"
# keys is a hit.
[http]
name="composer-auth-json-exposure"
port=80
endpoint="/auth.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
