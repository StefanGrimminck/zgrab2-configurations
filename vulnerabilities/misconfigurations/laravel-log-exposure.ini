# Exposed Laravel application log. Stack traces in it show file paths, SQL
# queries and at times credentials or tokens. A 200 with lines like
# "[2026-01-01 00:00:00] production.ERROR:" is a hit.
[http]
name="laravel-log-exposure"
port=80
endpoint="/storage/logs/laravel.log"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
