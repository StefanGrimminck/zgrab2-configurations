# Laravel running in debug mode with the Ignition error page. A 200 from
# /_ignition/health-check with {"can_execute_commands":true} shows the Ignition
# routes are reachable, the precondition for CVE-2021-3129 (Ignition below
# 2.5.2). The response does not show the version, so a hit is the exposure,
# not proof of the CVE.
[http]
name="laravel-ignition-health-check"
port=80
endpoint="/_ignition/health-check"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, the JSON answer is one line
max-size=4
