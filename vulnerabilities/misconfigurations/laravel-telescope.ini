# Exposed Laravel Telescope debug dashboard. /telescope shows recent requests, database
# queries, cache keys and exceptions, often including secrets. It should never be reachable
# in production.
[http]
name="laravel-telescope"
port=80
endpoint="/telescope/requests"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
