# Exposed Bash history of the account that owns the web root. A 200 with shell
# command lines is a hit; such histories often hold passwords typed on the
# command line.
[http]
name="bash-history-exposure"
port=80
endpoint="/.bash_history"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
