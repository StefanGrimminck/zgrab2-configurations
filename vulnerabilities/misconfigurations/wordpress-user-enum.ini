# WordPress username enumeration. /wp-json/wp/v2/users returns the author list as JSON
# when the REST API is open, handing attackers valid usernames for brute force.
[http]
name="wordpress-user-enum"
port=80
endpoint="/wp-json/wp/v2/users"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (int) Follow redirects
max-redirects=0
# (string) HTTP request method type
; method=GET
