# Exposed GitLab CI pipeline definition. A 200 YAML body with "stages:" or
# "script:" keys shows the build and deployment steps, and at times credentials
# in "variables".
[http]
name="gitlab-ci-exposure"
port=80
endpoint="/.gitlab-ci.yml"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
