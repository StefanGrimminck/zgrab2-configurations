# Exposed .env.prod, the production environment file of an application. A 200
# with lines like "APP_KEY=" or "DB_PASSWORD=" is a hit.
[http]
name="dotenv-prod-exposure"
port=80
endpoint="/.env.prod"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
