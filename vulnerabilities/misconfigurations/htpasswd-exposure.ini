# Exposed .htpasswd file. A 200 with "user:hash" lines, where the hash starts
# with "$apr1$" or "$2y$", gives the user names and password hashes of HTTP
# basic authentication.
[http]
name="htpasswd-exposure"
port=80
endpoint="/.htpasswd"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
