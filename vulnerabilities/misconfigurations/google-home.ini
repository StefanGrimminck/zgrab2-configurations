# Google Home / Chromecast device info. "eureka" is Chromecast's internal
# codename, and /setup/eureka_info on 8443 returns device JSON (name, ssdp_udn,
# cast build) without authentication. This is the Google cast endpoint, not
# Netflix Eureka. Confirm the device JSON in the response.
[http]
name="google-home"
port=8443
endpoint="/setup/eureka_info"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
