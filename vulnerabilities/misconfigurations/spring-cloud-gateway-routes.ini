# Spring Cloud Gateway actuator exposed without authentication. A 200 JSON
# list with "route_id" and "predicate" fields shows the gateway's routing
# table, and the same actuator is the entry point for CVE-2022-22947 (before
# 3.1.1 and 3.0.7).
[http]
name="spring-cloud-gateway-routes"
port=8080
endpoint="/actuator/gateway/routes"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough for the first routes
max-size=32
