# Exposed Git repository. A readable /.git/config means the whole working
# tree (source, and often the credentials in a committed .env or config file)
# can be reconstructed. A 200 whose body contains "[core]" is a hit.
[http]
name="git-config-exposure"
port=80
endpoint="/.git/config"

# Most exposures answer on 443 as well, so retry over TLS
retry-https=true

# (int) Capture the config body, where the signal lives
max-size=64
