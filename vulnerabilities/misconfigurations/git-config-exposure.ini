# Exposed Git repository. A readable /.git/config means the whole working tree
# (source, and often the credentials living in a committed .env or config file)
# can be reconstructed. This is one of the highest-volume campaigns in our
# honeypot data, probed across hundreds of path prefixes (/.git/config,
# /api/.git/config, /backend/.git/config, ...). A 200 whose body contains
# "[core]" is a hit.
[http]
name="git-config-exposure"
port=80
endpoint="/.git/config"

# Most exposures answer on 443 as well, so retry over TLS
retry-https=true

# (int) Capture the config body, where the signal lives
max-size=64

# (string) HTTP request method type
; method=GET

# (int) Follow redirects
; max-redirects=0
