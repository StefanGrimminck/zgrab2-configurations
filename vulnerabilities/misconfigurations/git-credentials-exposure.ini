# Exposed Git credential store. A 200 with lines of the form
# "https://user:token@host" hands over repository credentials.
[http]
name="git-credentials-exposure"
port=80
endpoint="/.git-credentials"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
