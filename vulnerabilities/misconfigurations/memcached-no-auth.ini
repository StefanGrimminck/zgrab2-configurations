# Internet-exposed memcached on 11211. memcached has no authentication, so
# the 'stats' command returns server stats and confirms the instance is open.
# It can also be abused for UDP reflection. A reply containing 'STAT' is a hit.
[banner]
name="memcached-no-auth"
port=11211
# probe escapes are doubled: go-flags unescapes once, the banner module's
# strconv.Unquote unescapes again into a real CRLF
probe="stats\\r\\n"
pattern="STAT"
