# Internet-exposed memcached on 11211. memcached has no authentication, so the 'stats'
# command returns server stats and confirms the instance is open (it can also be abused
# for UDP reflection). 11211 appears in our telemetry. Uses the banner module.
[banner]
name="memcached-no-auth"
port=11211
# probe escapes are doubled: go-flags unescapes once, the banner module's
# strconv.Unquote unescapes again into a real CRLF
probe="stats\\r\\n"
pattern="STAT"
