# Exposed Symfony web profiler. /_profiler/ leaks requests, configuration and environment
# data when the dev front controller is reachable in production. Probed in our telemetry,
# including /_profiler/phpinfo and /app_dev.php/_profiler.
[http]
name="symfony-profiler"
port=80
endpoint="/_profiler/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
