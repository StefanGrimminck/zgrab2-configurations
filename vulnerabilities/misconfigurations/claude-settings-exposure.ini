# Exposed Claude Code settings file. A 200 JSON body with "permissions", "env"
# or "hooks" keys is a hit; "env" often holds API keys.
[http]
name="claude-settings-exposure"
port=80
endpoint="/.claude/settings.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
