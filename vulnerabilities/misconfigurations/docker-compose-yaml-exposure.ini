# Exposed docker-compose.yaml in a web root. It describes every service of the
# deployment and often carries passwords in environment variables. A 200 YAML
# body with a "services:" key is a hit.
[http]
name="docker-compose-yaml-exposure"
port=80
endpoint="/docker-compose.yaml"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
