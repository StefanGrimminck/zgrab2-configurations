# Exposed application credentials file. A readable /api/credentials.json typically
# contains plaintext service or API credentials. This exact path is harvested by a
# broad campaign in our telemetry (hundreds of distinct sources).
[http]
name="credentials-json-exposure"
port=80
endpoint="/api/credentials.json"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (string) HTTP request method type
; method=GET
