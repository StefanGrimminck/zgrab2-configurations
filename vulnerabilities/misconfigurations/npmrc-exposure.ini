# Exposed .npmrc. A 200 with a "_authToken=" line holds a registry token that
# can publish packages; "registry=" lines name private registries.
[http]
name="npmrc-exposure"
port=80
endpoint="/.npmrc"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
