# Apache Tomcat Manager. /manager/html answers 401 with a 'Tomcat Manager
# Application' Basic-auth realm when present. It is the classic
# default-credentials / WAR-deploy foothold. Common on 8080.
[http]
name="tomcat-manager"
port=8080
endpoint="/manager/html"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max number of redirects to follow, none
max-redirects=0
