# Apache Tomcat Manager. /manager/html answers 401 with a 'Tomcat Manager Application'
# Basic-auth realm when present; it is the classic default-credentials / WAR-deploy
# foothold. Common on 8080.
[http]
name="tomcat-manager"
port=8080
endpoint="/manager/html"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Follow redirects
max-redirects=0
# (string) HTTP request method type
; method=GET
