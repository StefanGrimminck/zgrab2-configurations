# Exposed Vim swap file of wp-config.php. It holds the file's content,
# including the database credentials. A 200 whose body starts with "b0VIM" is a
# hit.
[http]
name="wordpress-config-swp-exposure"
port=80
endpoint="/wp-config.php.swp"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
