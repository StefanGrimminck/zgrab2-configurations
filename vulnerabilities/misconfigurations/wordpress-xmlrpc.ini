# WordPress XML-RPC endpoint. A GET to /xmlrpc.php returns 'XML-RPC server
# accepts POST requests only', confirming it is enabled. The endpoint is
# abused for credential brute-force amplification (system.multicall) and
# pingback DDoS/SSRF.
[http]
name="wordpress-xmlrpc"
port=80
endpoint="/xmlrpc.php"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=8
# (int) Max number of redirects to follow, none
max-redirects=0
