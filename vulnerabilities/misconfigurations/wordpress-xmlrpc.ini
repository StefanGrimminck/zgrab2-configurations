# WordPress XML-RPC endpoint. A GET to /xmlrpc.php returns 'XML-RPC server accepts POST
# requests only', confirming it is enabled, abused for credential brute-force
# amplification (system.multicall) and pingback DDoS/SSRF.
[http]
name="wordpress-xmlrpc"
port=80
endpoint="/xmlrpc.php"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=8
# (int) Follow redirects
max-redirects=0
# (string) HTTP request method type
; method=GET
