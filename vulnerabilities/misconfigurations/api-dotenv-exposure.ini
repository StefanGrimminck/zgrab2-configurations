# Exposed .env inside an /api/ directory, common where a backend is deployed in
# a subfolder of the web root. A 200 with KEY=value lines (APP_KEY=,
# DB_PASSWORD=) is a hit.
[http]
name="api-dotenv-exposure"
port=80
endpoint="/api/.env"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to see the first keys
max-size=16
