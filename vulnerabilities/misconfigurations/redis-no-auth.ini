# Internet-exposed Redis with no password. The default config accepts unauthenticated
# commands, so INFO/CONFIG succeed and the instance is fully readable and writable, a
# common RCE vector. Redis (6379) is widely probed in our telemetry. Native redis module.
[redis]
name="redis-no-auth"
port=6379

# Capture full connection detail (the base redis template leaves this off). On an
# open instance this records the INFO/CONFIG output that confirms the exposure.
verbose=true
