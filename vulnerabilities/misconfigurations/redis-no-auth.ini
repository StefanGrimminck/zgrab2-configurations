# Internet-exposed Redis with no password. The default config accepts
# unauthenticated commands, so INFO/CONFIG succeed and the instance is fully
# readable and writable, a common RCE vector. Default port 6379.
[redis]
name="redis-no-auth"
port=6379

# Capture full connection detail. On an open instance this records the
# INFO/CONFIG output that confirms the exposure.
verbose=true
