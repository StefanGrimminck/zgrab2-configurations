# OpenAI-compatible inference API without an API key, as served by vLLM,
# llama.cpp, LM Studio, LocalAI and LiteLLM. /v1/models returns
# {"object":"list","data":[...]} with the loaded models, and "owned_by" often
# names the server, such as "vllm" or "llamacpp". Anyone who reaches the port
# can run inference on the host. Port 8000 is the vLLM default.
[http]
name="openai-compatible-models"
port=8000
endpoint="/v1/models"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough for the model list
max-size=16
