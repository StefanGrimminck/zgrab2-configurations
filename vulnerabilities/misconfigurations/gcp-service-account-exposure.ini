# Exposed Google Cloud service account key. A 200 JSON body with "type":
# "service_account" and a "private_key" field gives full use of that account.
[http]
name="gcp-service-account-exposure"
port=80
endpoint="/service-account.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
