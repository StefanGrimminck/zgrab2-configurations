# phpinfo() left at /info.php. It discloses the PHP version, modules, paths
# and environment variables. A 200 whose body contains "PHP Version" and
# "phpinfo()" is a hit.
[http]
name="phpinfo-info-php-exposure"
port=80
endpoint="/info.php"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough for the version table
max-size=32
