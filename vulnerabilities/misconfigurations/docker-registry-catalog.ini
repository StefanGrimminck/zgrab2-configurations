# Open Docker Registry. /v2/_catalog lists every image repository when the registry
# allows anonymous pulls, often exposing proprietary images and embedded secrets.
# Probed in our telemetry.
[http]
name="docker-registry-catalog"
port=5000
endpoint="/v2/_catalog"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (string) HTTP request method type
; method=GET
