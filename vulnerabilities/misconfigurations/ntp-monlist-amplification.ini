# NTP monlist amplification (CVE-2013-5211). An ntpd with the legacy monlist
# command enabled returns a list of recent clients that is far larger than the
# request, which makes the server usable as a UDP reflection/amplification source
# for DDoS. This probe sends a single ReqMonGetList and records the response;
# a populated peer list confirms the server is abusable. Native ntp module on 123,
# not HTTP.
[ntp]
name="ntp-monlist-amplification"
port=123

# Send the monlist (ReqMonGetList) request rather than only asking for time.
monlist=true
# Skip the time request; only the monlist response matters here.
skip-get-time=true
# Record the returned peer list that confirms amplification.
verbose=true
