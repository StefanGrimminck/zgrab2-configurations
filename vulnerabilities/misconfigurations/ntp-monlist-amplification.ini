# NTP monlist amplification (CVE-2013-5211). An ntpd with the legacy monlist
# command answers a ReqMonGetList request with a list of recent clients far
# larger than the request, which makes the server usable as a UDP reflection
# and amplification source for DDoS. A populated peer list confirms the server
# is abusable. Port 123.
[ntp]
name="ntp-monlist-amplification"
port=123

# Send the monlist (ReqMonGetList) request rather than only asking for time.
monlist=true
# Skip the time request; only the monlist response matters here.
skip-get-time=true
# Record the returned peer list that confirms amplification.
verbose=true
