# JBoss JMX console reachable without authentication. HtmlAdaptor with
# action=inspectMBean shows the read-only view of the ServerInfo MBean. A 200
# whose body contains "jboss.system:type" and "HtmlAdaptor?action" means anyone
# can browse, and invoke, the server's MBeans. JBoss listens on 8080.
[http]
name="jboss-jmx-console"
port=8080
endpoint="/jmx-console/HtmlAdaptor?action=inspectMBean&name=jboss.system:type=ServerInfo"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough for the MBean view
max-size=32
