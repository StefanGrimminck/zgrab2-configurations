# Squid cache manager (cachemgr.cgi) reachable from the internet. When the
# manager interface is exposed it leaks internal client IPs, request stats and
# server internals, and an open Squid is frequently abusable as a relay. We see
# this CGI probed steadily, largely on 3128 and 8080. Default port here is 3128.
[http]
name="squid-cache-manager"
port=3128
endpoint="/squid-internal-mgr/cachemgr.cgi"

# Retry over TLS for HTTPS proxies
retry-https=true

# (string) HTTP request method type
; method=GET

# (int) Max kilobytes of response body to read
; max-size=64

# (int) Follow redirects
; max-redirects=0
