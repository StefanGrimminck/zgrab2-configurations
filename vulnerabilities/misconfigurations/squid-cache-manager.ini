# Squid cache manager (cachemgr.cgi) reachable from the internet. An exposed
# manager interface leaks internal client IPs, request stats and server
# internals, and an open Squid is frequently abusable as a relay. Default port
# 3128.
[http]
name="squid-cache-manager"
port=3128
endpoint="/squid-internal-mgr/cachemgr.cgi"

# Retry over TLS for HTTPS proxies
retry-https=true
