# Exposed Rails database configuration. A 200 YAML body with "adapter:",
# "username:" and "password:" keys is a hit.
[http]
name="rails-database-yml-exposure"
port=80
endpoint="/config/database.yml"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
