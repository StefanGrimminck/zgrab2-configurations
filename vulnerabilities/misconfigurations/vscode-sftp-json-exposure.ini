# Exposed .vscode/sftp.json, the settings file of the VS Code SFTP extension.
# It holds the deployment host, user name and often a password or key path. A
# 200 JSON body with "host" and "username" keys is a hit.
[http]
name="vscode-sftp-json-exposure"
port=80
endpoint="/.vscode/sftp.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, the file is small
max-size=16
