# Exposed Apache Solr admin API. /solr/admin/info/system?wt=json returns
# version and host details with no auth. An exposed Solr admin is the entry
# point for CVE-2019-17558 (Velocity RCE).
[http]
name="solr-admin"
port=8983
endpoint="/solr/admin/info/system?wt=json"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
