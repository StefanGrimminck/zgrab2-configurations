# Exposed Apache Solr admin API. /solr/admin/info/system?wt=json returns version and
# host details with no auth; an exposed Solr admin is the entry point for CVE-2019-17558
# (Velocity RCE). The Solr admin endpoints are probed in our telemetry.
[http]
name="solr-admin"
port=8983
endpoint="/solr/admin/info/system?wt=json"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (string) HTTP request method type
; method=GET
