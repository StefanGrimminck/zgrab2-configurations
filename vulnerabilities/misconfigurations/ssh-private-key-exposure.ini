# Exposed SSH private key. A readable /.ssh/id_rsa served over HTTP gives direct key-based
# access to wherever it is authorised. A 200 containing 'PRIVATE KEY' is a hit.
[http]
name="ssh-private-key-exposure"
port=80
endpoint="/.ssh/id_rsa"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
