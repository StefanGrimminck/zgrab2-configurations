# Exposed rclone configuration. A 200 with "[remote]" sections and "type ="
# lines holds the keys and tokens of the configured cloud storage.
[http]
name="rclone-conf-exposure"
port=80
endpoint="/rclone.conf"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
