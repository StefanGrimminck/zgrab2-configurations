# Apache mod_status exposed to the internet. /server-status returns the worker table,
# client IPs and recent request lines, a live view of who is talking to the server. A
# 200 containing 'Apache Server Status' is a hit. Probed steadily in our telemetry.
[http]
name="apache-server-status"
port=80
endpoint="/server-status"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (string) HTTP request method type
; method=GET
