# Exposed .pypirc. A 200 with a "[pypi]" section and a "password" or token line
# hands over package index credentials that can publish packages.
[http]
name="pypirc-exposure"
port=80
endpoint="/.pypirc"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
