# Apache Solr Core Admin API without authentication. A 200 JSON body from
# /solr/admin/cores with a "status" object lists every core with its
# "instanceDir" and "dataDir", and the same API can create and unload cores.
# Default port 8983.
[http]
name="solr-cores"
port=8983
endpoint="/solr/admin/cores?action=STATUS&wt=json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough for the core list
max-size=32
