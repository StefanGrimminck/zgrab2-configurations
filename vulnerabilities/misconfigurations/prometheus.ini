# Exposed Prometheus. Port 9090 is the Prometheus default; the instant-query API
# for prometheus_build_info returns the server version as JSON when the API is
# unauthenticated, confirming both the product and an open data API. A result
# containing "prometheus_build_info" confirms the exposure.
[http]
name="prometheus"
port=9090
endpoint="/api/v1/query?query=prometheus_build_info"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
