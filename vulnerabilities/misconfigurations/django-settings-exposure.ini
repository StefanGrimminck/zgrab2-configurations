# Exposed Django settings module served as text. A 200 containing "SECRET_KEY"
# and "DATABASES" is a hit.
[http]
name="django-settings-exposure"
port=80
endpoint="/settings.py"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
