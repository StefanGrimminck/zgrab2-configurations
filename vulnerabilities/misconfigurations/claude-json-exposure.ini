# Exposed .claude.json, the Claude Code user configuration. A 200 JSON body
# with "projects", "mcpServers" or "oauthAccount" keys shows project paths,
# account details and the credentials passed to MCP servers.
[http]
name="claude-json-exposure"
port=80
endpoint="/.claude.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
