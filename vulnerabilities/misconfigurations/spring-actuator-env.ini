# Exposed Spring Boot Actuator /env endpoint. /actuator/env returns the
# application environment as JSON, often including database URLs, tokens and
# other secrets.
[http]
name="spring-actuator-env"
port=8080
endpoint="/actuator/env"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
