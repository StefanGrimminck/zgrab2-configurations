# Exposed Spring Boot Actuator /env endpoint. It returns the application environment as
# JSON, often including database URLs, tokens and other secrets. The actuator paths
# (/actuator/env, /actuator/heapdump, /actuator/logfile) are probed continuously from
# cloud ranges in our telemetry.
[http]
name="spring-actuator-env"
port=8080
endpoint="/actuator/env"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (string) HTTP request method type
; method=GET
