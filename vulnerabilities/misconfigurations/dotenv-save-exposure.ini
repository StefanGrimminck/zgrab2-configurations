# Exposed .env.save, the copy editors such as nano write next to a .env
# file. It carries the same secrets as .env. A 200 with KEY=value lines
# (APP_KEY=, DB_PASSWORD=) is a hit.
[http]
name="dotenv-save-exposure"
port=80
endpoint="/.env.save"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to see the first keys
max-size=16
