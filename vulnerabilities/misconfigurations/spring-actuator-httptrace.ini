# Spring Boot Actuator httptrace endpoint (Spring Boot 2.0 and 2.1). A 200 JSON
# body with a "traces" list shows recent requests with their headers, including
# cookies and Authorization values of other users.
[http]
name="spring-actuator-httptrace"
port=8080
endpoint="/actuator/httptrace"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough for the first traces
max-size=32
