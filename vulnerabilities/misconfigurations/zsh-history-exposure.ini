# Exposed Zsh history of the account that owns the web root. A 200 with shell
# command lines, often prefixed ": <timestamp>:0;", is a hit.
[http]
name="zsh-history-exposure"
port=80
endpoint="/.zsh_history"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
