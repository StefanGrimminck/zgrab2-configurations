# Exposed AWS credentials file. A readable /.aws/credentials hands over long-lived access
# keys in plaintext. A 200 containing 'aws_access_key_id' is a hit. Probed broadly in our
# telemetry.
[http]
name="aws-credentials-exposure"
port=80
endpoint="/.aws/credentials"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
