# Exposed Go net/http/pprof profiling endpoint. /debug/pprof/ lists profiles that leak
# goroutine stacks, memory and command-line arguments, and /debug/pprof/profile can stall
# the process. A 200 listing 'goroutine' and 'heap' is a hit. Probed in our telemetry.
[http]
name="go-pprof-exposure"
port=80
endpoint="/debug/pprof/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (string) HTTP request method type
; method=GET
