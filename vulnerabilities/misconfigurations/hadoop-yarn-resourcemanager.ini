# Exposed Hadoop YARN ResourceManager REST API on 8088. /ws/v1/cluster/info
# returns the cluster state without authentication. The same API accepts
# /ws/v1/cluster/apps/new-application to schedule arbitrary commands, a
# well-known unauthenticated RCE.
[http]
name="hadoop-yarn-resourcemanager"
port=8088
endpoint="/ws/v1/cluster/info"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
