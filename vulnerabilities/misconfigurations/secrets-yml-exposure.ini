# Exposed secrets.yml in a web root, the name Rails and many deployment tools
# use for credentials. A 200 YAML body with keys such as "secret_key_base" or
# "password" is a hit.
[http]
name="secrets-yml-exposure"
port=80
endpoint="/secrets.yml"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
