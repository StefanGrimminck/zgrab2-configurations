# Exposed wp-config.php~, the backup copy editors leave next to wp-config.php.
# The web server returns it as text, with the database credentials and the
# authentication keys and salts. A 200 containing "DB_PASSWORD" is a hit.
[http]
name="wordpress-config-tilde-exposure"
port=80
endpoint="/wp-config.php~"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
