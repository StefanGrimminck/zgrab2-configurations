# Exposed Continue configuration. A 200 JSON body with a "models" list holds
# the provider of each model and its "apiKey".
[http]
name="continue-config-exposure"
port=80
endpoint="/.continue/config.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
