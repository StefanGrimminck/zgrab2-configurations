# Exposed Hadoop HDFS NameNode. Port 50070 is the NameNode web UI; the JMX query
# for NameNodeInfo returns cluster capacity, live/dead datanodes, and version as
# JSON beans without authentication. A "beans" JSON array confirms the exposure.
[http]
name="hadoop"
port=50070
endpoint="/jmx?qry=Hadoop:service=NameNode,name=NameNodeInfo"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (string) HTTP request method type
; method=GET
