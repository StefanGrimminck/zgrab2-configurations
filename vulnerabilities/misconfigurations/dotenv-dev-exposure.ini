# Exposed .env.dev, the development environment file of an application, which
# often holds working credentials. A 200 with KEY=value lines is a hit.
[http]
name="dotenv-dev-exposure"
port=80
endpoint="/.env.dev"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
