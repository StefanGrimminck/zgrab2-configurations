# Exposed production configuration of an ASP.NET Core application. A 200 JSON
# body with "ConnectionStrings" or "Logging" keys is a hit.
[http]
name="appsettings-production-exposure"
port=80
endpoint="/appsettings.Production.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
