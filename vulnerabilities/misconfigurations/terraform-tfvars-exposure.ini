# Exposed Terraform variables file. A 200 with name = "value" assignments often
# holds cloud access keys and database passwords.
[http]
name="terraform-tfvars-exposure"
port=80
endpoint="/terraform.tfvars"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
