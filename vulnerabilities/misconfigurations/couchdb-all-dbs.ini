# Open Apache CouchDB. /_all_dbs lists every database when the admin party is
# enabled (no authentication), so the whole datastore is world-readable.
# Default port 5984.
[http]
name="couchdb-all-dbs"
port=5984
endpoint="/_all_dbs"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
