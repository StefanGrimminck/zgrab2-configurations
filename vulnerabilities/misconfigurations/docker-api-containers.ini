# Exposed Docker Engine API. /containers/json on an unauthenticated daemon
# lists every running container; the same API can create privileged containers
# and take the host. Default ports 2375 and 2376.
[http]
name="docker-containers"
port=2375
endpoint="/containers/json"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
