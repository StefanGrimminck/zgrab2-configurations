# Generic directory-traversal to /etc/passwd. A 200 whose body contains 'root:x:0:0'
# means the front-end or a vulnerable handler served a system file. This encoded
# traversal is one of the highest-volume single probes in our telemetry.
[http]
name="path-traversal-etc-passwd"
port=80
endpoint="/..%2F..%2F..%2F..%2F..%2F..%2Fetc%2Fpasswd"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=8
# (string) HTTP request method type
; method=GET
