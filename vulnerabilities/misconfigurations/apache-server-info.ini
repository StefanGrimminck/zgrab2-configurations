# Apache mod_info exposed to the internet. /server-info dumps the full server
# configuration, loaded modules and their settings. A 200 containing 'Apache Server
# Information' is a hit.
[http]
name="apache-server-info"
port=80
endpoint="/server-info"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (string) HTTP request method type
; method=GET
