# Exposed .env.bak, a backup copy of a .env file with the same database
# passwords, API keys and app secrets. A 200 with lines like "APP_KEY=" or
# "DB_PASSWORD=" is a hit.
[http]
name="dotenv-bak-exposure"
port=80
endpoint="/.env.bak"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
