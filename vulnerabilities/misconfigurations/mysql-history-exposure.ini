# Exposed MySQL client history. A 200 with SQL statements is a hit; the file
# often holds statements that set or contain passwords.
[http]
name="mysql-history-exposure"
port=80
endpoint="/.mysql_history"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
