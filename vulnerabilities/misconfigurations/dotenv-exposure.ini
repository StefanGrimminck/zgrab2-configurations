# Exposed .env file (Laravel, Symfony, Node and others). It holds database
# passwords, API keys and app secrets in plaintext and is mass-harvested by
# the AndroxGh0st botnet. A 200 containing lines like "APP_KEY=" or
# "DB_PASSWORD=" is a hit.
[http]
name="dotenv-exposure"
port=80
endpoint="/.env"

# Frequently exposed behind TLS as well
retry-https=true

# (int) Capture the file body
max-size=64
