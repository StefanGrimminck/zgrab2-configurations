# Exposed .env file (Laravel / Symfony / Node and friends). These hold database
# passwords, API keys and app secrets in plaintext. Mass-harvested by the
# AndroxGh0st botnet; /.env (and /env) is probed by over a thousand distinct
# sources per week in our telemetry. A 200 containing lines like "APP_KEY=" or
# "DB_PASSWORD=" is a hit.
[http]
name="dotenv-exposure"
port=80
endpoint="/.env"

# Frequently exposed behind TLS as well
retry-https=true

# (int) Capture the file body
max-size=64

# (string) HTTP request method type
; method=GET

# (int) Follow redirects
; max-redirects=0
