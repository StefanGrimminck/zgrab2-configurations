# Exposed SQL dump. A 200 body with "CREATE TABLE" or "INSERT INTO" statements,
# or a "-- MySQL dump" or "PostgreSQL database dump" header, hands over the
# database content.
[http]
name="dump-sql-exposure"
port=80
endpoint="/dump.sql"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
