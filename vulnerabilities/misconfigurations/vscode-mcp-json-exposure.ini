# Exposed VS Code MCP configuration. A 200 JSON body with a "servers" object
# lists the MCP servers, their commands and the secrets passed to them.
[http]
name="vscode-mcp-json-exposure"
port=80
endpoint="/.vscode/mcp.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
