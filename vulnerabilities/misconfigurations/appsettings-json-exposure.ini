# Exposed appsettings.json, the configuration file of ASP.NET Core
# applications. It often holds database connection strings and API keys. A 200
# JSON body with "ConnectionStrings" or "Logging" keys is a hit.
[http]
name="appsettings-json-exposure"
port=80
endpoint="/appsettings.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to see the top-level keys
max-size=16
