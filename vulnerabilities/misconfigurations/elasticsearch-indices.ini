# Open Elasticsearch. /_cat/indices lists every index as JSON on 9200 when the
# cluster accepts unauthenticated reads, exposing index names and document counts.
# A JSON array of index rows confirms the exposure.
[http]
name="elasticsearch-indices"
port=9200
endpoint="/_cat/indices?format=json"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (string) HTTP request method type
; method=GET
