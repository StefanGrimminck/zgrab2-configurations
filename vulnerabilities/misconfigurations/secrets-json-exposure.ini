# Exposed secrets.json in a web root. A 200 JSON body with keys such as
# "password", "token" or "secret" is a hit.
[http]
name="secrets-json-exposure"
port=80
endpoint="/secrets.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
