# Exposed Windsurf MCP configuration. A 200 JSON body with an "mcpServers"
# object lists the servers, their commands and the API keys in their "env"
# blocks.
[http]
name="windsurf-mcp-config-exposure"
port=80
endpoint="/.codeium/windsurf/mcp_config.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
