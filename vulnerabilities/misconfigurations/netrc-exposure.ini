# Exposed .netrc. A 200 with "machine", "login" and "password" entries hands
# over the stored logins of command-line tools.
[http]
name="netrc-exposure"
port=80
endpoint="/.netrc"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
