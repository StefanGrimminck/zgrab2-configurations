# Exposed wp-config.php.old, a renamed copy of the WordPress configuration that
# the web server returns as text. A 200 containing "DB_PASSWORD" is a hit.
[http]
name="wordpress-config-old-exposure"
port=80
endpoint="/wp-config.php.old"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to confirm the content
max-size=16
