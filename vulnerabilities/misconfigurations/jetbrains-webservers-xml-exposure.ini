# Exposed .idea/WebServers.xml, where JetBrains IDEs keep deployment
# servers: FTP or SFTP hosts, user names and sometimes passwords. A 200 XML
# body with a "<project" root and "WebServers" component is a hit.
[http]
name="jetbrains-webservers-xml-exposure"
port=80
endpoint="/.idea/WebServers.xml"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, the file is small
max-size=16
