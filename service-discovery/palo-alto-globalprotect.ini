# Palo Alto Networks GlobalProtect SSL VPN portal. /global-protect/login.esp is
# the portal login surface and identifies a GlobalProtect / PAN-OS appliance, the
# attack surface behind CVE-2024-3400 and CVE-2019-1579. We see this exact path
# probed in our telemetry.
[http]
name="globalprotect"
port=443
endpoint="/global-protect/login.esp"

# GlobalProtect portals are HTTPS
use-https=true

# (string) HTTP request method type
; method=GET

# (int) Follow redirects (portals often 302 to the login page)
max-redirects=2
