# Swagger UI / OpenAPI documentation exposed to the internet. /swagger-ui.html maps the
# application's API surface, which is useful reconnaissance for follow-up requests. Probed
# in our telemetry.
[http]
name="swagger-ui"
port=80
endpoint="/swagger-ui.html"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
