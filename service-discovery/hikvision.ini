# Hikvision IP camera, DVR or NVR web interface. /doc/page/login.asp is the
# device login page; a "Server: Hikvision-Webs" header or "Hikvision Digital
# Technology" in the body identifies the vendor.
[http]
name="hikvision"
port=80
endpoint="/doc/page/login.asp"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough for the login page head
max-size=16
