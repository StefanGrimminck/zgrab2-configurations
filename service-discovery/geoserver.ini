# GeoServer web administration UI. /geoserver/web/ fingerprints the application, the
# surface behind CVE-2024-36401 (evaluation RCE).
[http]
name="geoserver"
port=8080
endpoint="/geoserver/web/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
