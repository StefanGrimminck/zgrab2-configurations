# Argo CD GitOps controller. /api/version returns the version JSON without auth and
# fingerprints the instance, the surface behind several Argo CD auth and RBAC CVEs.
[http]
name="argocd"
port=443
endpoint="/api/version"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
