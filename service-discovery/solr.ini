# Apache Solr admin console. Port 8983 is the Solr default; /solr/ serves the
# Solr Admin UI and fingerprints the search server. The solr-admin misconfiguration
# probe reads the version API separately. Confirm the Solr Admin markup here.
[http]
name="solr"
port=8983
endpoint="/solr/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
