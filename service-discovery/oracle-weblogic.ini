# Oracle WebLogic Server admin console. /console/login/LoginForm.jsp fingerprints the
# console, the surface behind CVE-2020-14882 and the long line of WebLogic
# deserialisation CVEs. Default port 7001.
[http]
name="oracle-weblogic"
port=7001
endpoint="/console/login/LoginForm.jsp"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
