# InfluxDB HTTP API on 8086. A bare /query with no statement returns a 400
# with {"error":"missing required parameter \"q\""} and, more reliably, an
# X-Influxdb-Version response header that identifies the build.
[http]
name="influxdb"
port=8086
endpoint="/query"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
