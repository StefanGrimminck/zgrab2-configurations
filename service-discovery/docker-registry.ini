# Docker Registry v2 API. /v2/ returns 200 (or 401) with a
# 'Docker-Distribution-Api-Version: registry/2.0' header that fingerprints the
# registry. The registry API is probed in our telemetry.
[http]
name="docker-registry"
port=5000
endpoint="/v2/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
