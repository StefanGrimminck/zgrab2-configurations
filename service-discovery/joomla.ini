# Joomla content management system. /administrator/ returns the admin login
# and identifies Joomla, a frequent target for component CVEs and credential
# attacks.
[http]
name="joomla"
port=80
endpoint="/administrator/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (int) Max number of redirects to follow
max-redirects=2
