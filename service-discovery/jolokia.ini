# Jolokia JMX-over-HTTP agent. /jolokia/version identifies the agent and
# returns its version metadata, here on port 8778.
[http]
name="jolokia"
port=8778
endpoint="/jolokia/version"

# The agent commonly runs behind a reverse proxy or TLS terminator.
retry-https=true

# Version metadata is small; cap the captured response accordingly.
max-size=16
