# Jolokia JMX-over-HTTP agent. /jolokia/version is a read-only endpoint that
# identifies the agent and returns its version metadata, without enumerating or
# invoking MBeans. It was requested 24,448 times by 1,420 source IPs in the
# 2026-04-22 through 2026-07-20 Honeylabs telemetry window.
[http]
name="jolokia"
port=8778
endpoint="/jolokia/version"

# The agent commonly runs behind a reverse proxy or TLS terminator.
retry-https=true

# Version metadata is small; cap the captured response accordingly.
max-size=16

# (string) HTTP request method type
; method=GET
