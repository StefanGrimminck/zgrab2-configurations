# JetBrains TeamCity CI server. /login.html returns the login and fingerprints the version,
# the surface behind CVE-2024-27198 and CVE-2023-42793 authentication bypasses. Default 8111.
[http]
name="teamcity"
port=8111
endpoint="/login.html"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
