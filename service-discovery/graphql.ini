# GraphQL endpoint. /graphql identifies a GraphQL server. Where schema
# introspection is left enabled, the full type system can be queried, which
# makes the endpoint a common target.
[http]
name="graphql"
port=80
endpoint="/graphql"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (int) Max number of redirects to follow
max-redirects=2
