# Apache ActiveMQ web console on 8161. /admin/ answers with an 'ActiveMQRealm'
# Basic-auth challenge that identifies the broker. The console is the
# management surface next to the CVE-2023-46604 OpenWire RCE.
[http]
name="apache-activemq"
port=8161
endpoint="/admin/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max number of redirects to follow
max-redirects=0
