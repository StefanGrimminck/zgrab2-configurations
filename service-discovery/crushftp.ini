# CrushFTP managed file-transfer server. /WebInterface/ serves the CrushFTP web
# client and fingerprints the product via its CrushFTP-branded login UI. A marquee
# target behind repeated auth-bypass and RCE flaws (CVE-2024-4040, CVE-2025-31161).
# This probe only reads the web interface; it does not send the auth-bypass. Default
# HTTPS port here is 443; CrushFTP is also common on 8080 and 2000.
[http]
name="crushftp"
port=443
endpoint="/WebInterface/"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
