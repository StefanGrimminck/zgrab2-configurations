# CrushFTP managed file-transfer server. /WebInterface/ serves the CrushFTP
# web client and its CrushFTP-branded login UI identifies the product. Entry
# point for repeated auth-bypass and RCE flaws (CVE-2024-4040,
# CVE-2025-31161). Port 443 here; CrushFTP is also common on 8080 and 2000.
[http]
name="crushftp"
port=443
endpoint="/WebInterface/"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (int) Max number of redirects to follow
max-redirects=2
