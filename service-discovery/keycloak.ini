# Keycloak identity provider. /realms/master/.well-known/openid-configuration
# returns the master realm OIDC metadata without authentication and reveals
# the version, which ties a host to Keycloak CVEs. Common on 8080.
[http]
name="keycloak"
port=8080
endpoint="/realms/master/.well-known/openid-configuration"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
