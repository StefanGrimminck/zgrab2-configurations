# Keycloak identity provider. /realms/master/.well-known/openid-configuration returns the
# master realm OIDC metadata without auth and fingerprints the version, useful for tracking
# Keycloak CVEs. Common on 8080.
[http]
name="keycloak"
port=8080
endpoint="/realms/master/.well-known/openid-configuration"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (string) HTTP request method type
; method=GET
