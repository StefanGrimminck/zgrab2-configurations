# Microsoft RD Web Access, the web front end of Remote Desktop Gateway.
# /RDWeb/ redirects to the RDWeb logon page and fingerprints an exposed RDS
# deployment. Port 443 (TLS).
[http]
name="ms-rdweb"
port=443
endpoint="/RDWeb/"

# Service speaks TLS by default
use-https=true
# (int) Follow redirects
max-redirects=2
