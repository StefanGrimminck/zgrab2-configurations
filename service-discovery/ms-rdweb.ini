# Microsoft RD Web Access (Remote Desktop Gateway web front-end). /RDWeb/ redirects
# to the RDWeb logon page and fingerprints an exposed RDS deployment. Probed on 443
# in our telemetry.
[http]
name="ms-rdweb"
port=443
endpoint="/RDWeb/"

# Service speaks TLS by default
use-https=true
# (int) Follow redirects
max-redirects=2
# (string) HTTP request method type
; method=GET
