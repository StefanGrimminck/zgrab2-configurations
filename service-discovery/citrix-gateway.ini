# Citrix Gateway / NetScaler (ADC). /logon/LogonPoint/tmindex.html is the gateway logon
# page and fingerprints the appliance, the surface behind CVE-2019-19781 and
# CVE-2023-4966 (Citrix Bleed).
[http]
name="citrix-gateway"
port=443
endpoint="/logon/LogonPoint/tmindex.html"

# Service speaks TLS by default
use-https=true
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
