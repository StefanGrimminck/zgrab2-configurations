# Microsoft Exchange Outlook Web Access. /owa/auth/logon.aspx is the OWA login
# page; the response and its headers fingerprint an Exchange server. This is the
# discovery probe, distinct from the ProxyShell detection under
# vulnerabilities/exploitation/.
[http]
name="exchange"
port=443
endpoint="/owa/auth/logon.aspx"

# Service speaks TLS by default
use-https=true
# (int) Max number of redirects to follow
max-redirects=3
# (string) HTTP request method type
method=GET
