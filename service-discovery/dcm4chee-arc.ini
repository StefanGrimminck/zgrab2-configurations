# dcm4chee-arc, an open-source DICOM/PACS archive for medical imaging.
# /dcm4chee-arc/ui2/ is its web console route and identifies the product on
# its default port. Depending on access control, an exposed archive can leak
# patient imaging studies to unauthenticated callers.
[http]
name="dcm4chee-arc"
port=8080
endpoint="/dcm4chee-arc/ui2/"

# (bool) Retry with HTTPS if the initial request fails
retry-https=true

# (int) Max kilobytes of response body to read
max-size=16
