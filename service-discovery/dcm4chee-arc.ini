# dcm4chee-arc, an open-source DICOM/PACS archive for medical imaging. /ui2/ is
# its web console route and fingerprints the product on its default port. An
# exposed archive can leak patient imaging studies to unauthenticated callers
# depending on how access control is configured. Probed in our telemetry by a
# DICOMweb-focused scanner.
[http]
name="dcm4chee-arc"
port=8080
endpoint="/dcm4chee-arc/ui2/"

# (string) HTTP request method type
; method=GET

# (bool) Retry with HTTPS if the initial request fails
retry-https=true

# (int) Max kilobytes of response body to read
max-size=16
