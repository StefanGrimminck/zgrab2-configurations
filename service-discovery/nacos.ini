# Alibaba Nacos service registry / config console on 8848. /nacos/ returns the console
# and fingerprints Nacos, the surface behind the CVE-2021-29441 authentication bypass.
[http]
name="nacos"
port=8848
endpoint="/nacos/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
