# Axis network camera. /axis-cgi/param.cgi answers with an 'AXIS' Basic-auth realm and
# fingerprints the device. Axis CGI paths are probed in our telemetry.
[http]
name="axis-camera"
port=80
endpoint="/axis-cgi/param.cgi?action=list"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (int) Max number of redirects to follow
max-redirects=0
# (string) HTTP request method type
; method=GET
