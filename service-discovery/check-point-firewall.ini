# Check Point firewall management / portal login. The appliance serves its web
# login over TLS on 981, a Check Point default; a Check Point-branded login page
# at /login fingerprints the device. Confirm the Check Point branding in the
# response before treating a hit as this product.
[http]
name="check-point-firewall"
port=981
endpoint="/login"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
