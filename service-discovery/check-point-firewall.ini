# Check Point firewall management and portal login. The appliance serves its
# web login over TLS on 981, a Check Point default. A Check Point-branded
# login page at /login is the marker for a hit.
[http]
name="check-point-firewall"
port=981
endpoint="/login"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=16
