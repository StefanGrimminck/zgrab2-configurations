# Cacti network monitoring. /cacti/ returns the login page and identifies the
# install, the surface behind CVE-2022-46169 (unauthenticated command
# injection) and several SQL injection CVEs.
[http]
name="cacti"
port=80
endpoint="/cacti/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (int) Max number of redirects to follow
max-redirects=2
