# VMware ESXi or vCenter Server vSphere API. /sdk/vimServiceVersions.xml is a
# public file that lists the API versions the host supports; a body with
# <namespace>urn:vim25</namespace> and <version> elements identifies the
# service and its release line.
[http]
name="vmware-vsphere-api"
port=443
endpoint="/sdk/vimServiceVersions.xml"

# Service speaks TLS by default
use-https=true

# (int) Max kilobytes of response body to read, the version list is small
max-size=8
