# Adobe ColdFusion administrator. /CFIDE/administrator/index.cfm fingerprints ColdFusion,
# the surface behind CVE-2023-26360 and CVE-2023-29298.
[http]
name="adobe-coldfusion"
port=80
endpoint="/CFIDE/administrator/index.cfm"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
