# Harbor container registry. /api/v2.0/systeminfo returns the version and settings without
# auth and fingerprints the registry, the surface behind CVE-2022-46463 and others.
[http]
name="harbor"
port=443
endpoint="/api/v2.0/systeminfo"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (string) HTTP request method type
; method=GET
