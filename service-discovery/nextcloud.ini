# Nextcloud and ownCloud. /status.php returns JSON with the product name and version
# without authentication, a clean fingerprint. Probed in our telemetry, including the
# /owncloud/status.php subpath.
[http]
name="nextcloud"
port=80
endpoint="/status.php"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
