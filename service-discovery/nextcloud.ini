# Nextcloud and ownCloud. /status.php returns JSON with the product name and
# version without authentication, a clean fingerprint. Some installs serve it
# under a subpath such as /owncloud/status.php.
[http]
name="nextcloud"
port=80
endpoint="/status.php"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
