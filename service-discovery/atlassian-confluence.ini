# Atlassian Confluence. /status returns a small JSON {"state":"RUNNING"} on a live
# instance and fingerprints the app (surface behind CVE-2022-26134 and
# CVE-2023-22527). The Confluence /wiki context root is probed in our telemetry.
[http]
name="atlassian-confluence"
port=8090
endpoint="/status"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
