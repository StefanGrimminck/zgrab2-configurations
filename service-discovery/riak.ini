# Riak KV HTTP API on 8098. /stats returns JSON with a riak_kv_version field
# (and many node counters) that fingerprints the database when stats are left
# enabled. Confirm the riak_kv_version marker in the response.
[http]
name="riak"
port=8098
endpoint="/stats"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (string) HTTP request method type
; method=GET
