# Riak KV HTTP API on 8098. /stats returns JSON with a riak_kv_version field
# and many node counters, which fingerprints the database when stats are left
# enabled. The riak_kv_version marker confirms a hit.
[http]
name="riak"
port=8098
endpoint="/stats"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
