# Docker Engine remote API exposed in cleartext on 2375. /version returns JSON
# with ApiVersion and Version fields; an unauthenticated daemon means full
# control of the host, so this is both a fingerprint and a serious exposure.
# Confirm the ApiVersion marker in the response.
[http]
name="docker-api-plain"
port=2375
endpoint="/version"

# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
