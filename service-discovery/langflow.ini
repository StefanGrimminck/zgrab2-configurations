# Langflow, a visual builder for LLM/agent workflows. /api/v1/version returns a
# JSON object with "version" and "package":"langflow" that fingerprints the app on
# its default port 7860. An exposed Langflow is the surface for CVE-2025-3248, an
# unauthenticated code-execution flaw in /api/v1/validate/code that is actively
# exploited to drop miners; this probe only reads the version endpoint and sends no
# code. Confirm the "langflow" package marker in the response.
[http]
name="langflow"
port=7860
endpoint="/api/v1/version"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
