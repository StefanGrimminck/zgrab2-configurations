# Langflow, a visual builder for LLM and agent workflows. /api/v1/version
# returns a JSON object with "version" and "package":"langflow", which
# fingerprints the app on its default port 7860. An exposed Langflow is the
# surface for CVE-2025-3248, unauthenticated code execution in
# /api/v1/validate/code that is actively exploited to drop miners.
[http]
name="langflow"
port=7860
endpoint="/api/v1/version"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
