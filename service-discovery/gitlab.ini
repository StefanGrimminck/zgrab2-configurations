# GitLab. /users/sign_in is always reachable, and the page with its 'Gitlab'
# cookies and headers identifies the instance, the surface behind
# CVE-2023-7028 and CVE-2024-0402.
[http]
name="gitlab"
port=443
endpoint="/users/sign_in"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Max number of redirects to follow
max-redirects=2
