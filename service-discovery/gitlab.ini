# GitLab. /users/sign_in is always reachable and the page + 'Gitlab' cookies/headers
# fingerprint the instance (surface behind CVE-2023-7028 and CVE-2024-0402).
[http]
name="gitlab"
port=443
endpoint="/users/sign_in"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Follow redirects
max-redirects=2
# (string) HTTP request method type
; method=GET
