# Microsoft SharePoint Server. Every SharePoint page carries a
# "MicrosoftSharePointTeamServices" response header with the build number,
# which identifies the version; /_layouts/15/error.aspx answers without a
# login on SharePoint 2013 and later. SharePoint is the surface behind
# CVE-2025-53770.
[http]
name="sharepoint"
port=80
endpoint="/_layouts/15/error.aspx"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, the header carries the signal
max-size=16
