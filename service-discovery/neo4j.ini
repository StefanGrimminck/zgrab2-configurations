# Neo4j Browser. Port 7474 is the Neo4j HTTP default; /browser/ serves the Neo4j
# Browser web UI, which fingerprints the database. Confirm the Neo4j Browser
# markup in the response.
[http]
name="neo4j"
port=7474
endpoint="/browser/"

# (int) Max kilobytes of response body to read
max-size=16
# (bool) Retry with HTTPS if the initial request fails
; retry-https=true
# (string) HTTP request method type
; method=GET
