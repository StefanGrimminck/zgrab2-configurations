# Spring Boot Actuator. /actuator/health returns {"status":"UP"}; when other actuator
# endpoints (/env, /heapdump) are exposed they leak secrets. Fingerprints a Spring
# Boot app. Common on 8080.
[http]
name="spring-boot-actuator"
port=8080
endpoint="/actuator/health"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
