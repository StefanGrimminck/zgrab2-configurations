# Spring Boot Actuator. /actuator/health returns {"status":"UP"} and
# fingerprints a Spring Boot app; when other actuator endpoints (/env,
# /heapdump) are exposed they leak secrets. Common on 8080.
[http]
name="spring-boot-actuator"
port=8080
endpoint="/actuator/health"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
