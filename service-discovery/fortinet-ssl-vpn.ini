# Fortinet FortiGate SSL VPN web portal. /remote/login is the portal login and
# fingerprints FortiOS, the surface behind CVE-2018-13379, CVE-2022-42475 and
# CVE-2024-21762. The /remote/* paths are heavily probed in our telemetry.
[http]
name="fortinet-ssl-vpn"
port=443
endpoint="/remote/login"

# Service speaks TLS by default
use-https=true
# (int) Follow redirects
max-redirects=2
# (string) HTTP request method type
; method=GET
