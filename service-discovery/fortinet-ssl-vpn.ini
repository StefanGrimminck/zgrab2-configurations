# Fortinet FortiGate SSL VPN web portal. /remote/login is the portal login and
# identifies FortiOS, the surface behind CVE-2018-13379, CVE-2022-42475 and
# CVE-2024-21762.
[http]
name="fortinet-ssl-vpn"
port=443
endpoint="/remote/login"

# Service speaks TLS by default
use-https=true
# (int) Max number of redirects to follow
max-redirects=2
