# Apache ZooKeeper four-letter-word admin interface on 2181. The 'ruok' probe returns
# 'imok' on a reachable node, and 'stat'/'envi' leak version and client lists when the
# 4lw allowlist is open. 2181 appears in our telemetry. Uses the banner module.
[banner]
name="zookeeper"
port=2181
probe="ruok"
pattern="imok"
