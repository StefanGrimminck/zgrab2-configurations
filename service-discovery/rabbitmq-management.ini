# RabbitMQ management plugin (HTTP API and UI), default port 15672.
# /api/overview needs a login, so the request gets a 401 whose
# "WWW-Authenticate: Basic realm=..." and "Server: Cowboy" headers identify
# the service.
[http]
name="rabbitmq-management"
port=15672
endpoint="/api/overview"

# (bool) Retry with HTTPS if the initial request fails
retry-https=true

# (int) Max kilobytes of response body to read
max-size=64
