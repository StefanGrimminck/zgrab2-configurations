# RabbitMQ management plugin (HTTP API + UI), default port 15672. /api/overview
# returns the broker version and cluster stats. On a misconfigured node the
# default guest:guest login is accepted remotely and the call returns 200 JSON;
# otherwise the 401 still fingerprints the service via its
# "WWW-Authenticate: Basic realm=..." and "Server: Cowboy" headers. 15672 shows
# up repeatedly in our telemetry.
[http]
name="rabbitmq-management"
port=15672
endpoint="/api/overview"

# (string) HTTP request method type
; method=GET

# (bool) Retry with HTTPS if the initial request fails
retry-https=true

# (int) Max kilobytes of response body to read
max-size=64

# (int) Follow redirects
; max-redirects=0
