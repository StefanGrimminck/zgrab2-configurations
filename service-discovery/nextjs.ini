# Next.js application server. The root response carries an 'x-powered-by: Next.js' header
# and embeds a __NEXT_DATA__ script, fingerprinting the framework (relevant to the
# CVE-2025-29927 middleware bypass). The /_next and /api paths are probed against 3000-series
# ports in our telemetry.
[http]
name="nextjs"
port=3000
endpoint="/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
