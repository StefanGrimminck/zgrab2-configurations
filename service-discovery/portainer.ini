# Portainer container management UI. /api/status returns {"Version":...} without auth
# and fingerprints the instance; an unprotected Portainer controls the Docker host.
# Default 9000.
[http]
name="portainer"
port=9000
endpoint="/api/status"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
