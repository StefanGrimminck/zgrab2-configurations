# OpenAPI specification at /openapi.json, the default location in FastAPI and
# several other frameworks. A 200 JSON body starting with an "openapi" version
# field lists every route and schema of the API. Port 8000 is the usual FastAPI
# development port.
[http]
name="openapi-json"
port=8000
endpoint="/openapi.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough for the info block
max-size=64
