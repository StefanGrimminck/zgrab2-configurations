# Grafana. /api/health is unauthenticated and returns {"database":"ok","version":...},
# fingerprinting the version (relevant to CVE-2021-43798 path traversal). Default 3000.
[http]
name="grafana"
port=3000
endpoint="/api/health"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
