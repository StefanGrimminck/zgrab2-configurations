# Elasticsearch. The root document on 9200 returns JSON with the cluster name,
# version, and the tagline "You Know, for Search", a clean unauthenticated
# fingerprint. Confirm that tagline in the response.
[http]
name="elasticsearch"
port=9200
endpoint="/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
