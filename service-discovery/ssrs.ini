# Microsoft SQL Server Reporting Services. /ReportServer is the web service
# root; its page title, rsreportserver banner or 401 realm reads "Microsoft
# SQL Server Reporting Services". It is the surface for CVE-2020-0618, a
# ViewState deserialization RCE via /ReportServer/pages/ReportViewer.aspx.
# Default port 80, also common on 443 and 8080.
[http]
name="ssrs"
port=80
endpoint="/ReportServer"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (int) Max number of redirects to follow
max-redirects=2
