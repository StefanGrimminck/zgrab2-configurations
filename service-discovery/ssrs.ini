# Microsoft SQL Server Reporting Services. /ReportServer is the SSRS web service
# root and fingerprints the product via its "Microsoft SQL Server Reporting
# Services" response (page title or the rsreportserver banner / 401 realm). An
# exposed instance is the surface for CVE-2020-0618, a ViewState deserialization
# RCE reached through /ReportServer/pages/ReportViewer.aspx. This probe only reads
# the service root. Default port 80; also common on 443 and 8080.
[http]
name="ssrs"
port=80
endpoint="/ReportServer"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
