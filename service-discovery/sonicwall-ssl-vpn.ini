# SonicWall SMA / SSL-VPN portal. /sslvpn_logon.shtml is the appliance login page
# and fingerprints the device (surface behind CVE-2021-20016 and CVE-2024-53704).
# Probed in our telemetry on assorted high ports.
[http]
name="sonicwall-ssl-vpn"
port=443
endpoint="/sslvpn_logon.shtml"

# Service speaks TLS by default
use-https=true
# (int) Follow redirects
max-redirects=2
# (string) HTTP request method type
; method=GET
