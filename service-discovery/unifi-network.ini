# Ubiquiti UniFi Network application (controller). /status answers without a
# login with JSON whose "meta" object holds "server_version" and "up". Default
# port 8443 (TLS).
[http]
name="unifi-network"
port=8443
endpoint="/status"

# Service speaks TLS by default
use-https=true

# (int) Max kilobytes of response body to read, the status object is one line
max-size=1
