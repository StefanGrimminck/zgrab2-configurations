# Oracle GlassFish / Payara admin console on 4848. /common/index.jsf returns the admin UI
# and fingerprints the server, the surface behind CVE-2017-1000028 path traversal.
[http]
name="glassfish"
port=4848
endpoint="/common/index.jsf"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
