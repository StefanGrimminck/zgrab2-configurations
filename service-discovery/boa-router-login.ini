# Boa web server router admin (Realtek and many ISP-branded fibre and DSL
# modems). /boaform/admin/formLogin is the login handler and identifies the
# device, a recurring default-credential and command-injection target.
[http]
name="boa-router-login"
port=80
endpoint="/boaform/admin/formLogin"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max number of redirects to follow
max-redirects=2
