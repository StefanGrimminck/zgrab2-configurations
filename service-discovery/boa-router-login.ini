# Boa web server router admin (Realtek and many ISP-branded fibre/DSL modems).
# /boaform/admin/formLogin is the login handler and fingerprints the device, a recurring
# default-credential and command-injection target. Probed steadily in our telemetry.
[http]
name="boa-router-login"
port=80
endpoint="/boaform/admin/formLogin"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
