# ComfyUI, the node-based Stable Diffusion front end. /system_stats returns OS,
# Python, PyTorch and GPU/VRAM details on the unauthenticated default install,
# a 200 with a "system" JSON object confirms it. Default port 8188. Seen in our
# telemetry alongside /object_info and /models from the same scanning clients,
# both other unauthenticated ComfyUI routes.
[http]
name="comfyui"
port=8188
endpoint="/system_stats"

# (string) HTTP request method type
; method=GET

# (bool) Retry with HTTPS if the initial request fails
retry-https=true

# (int) Max kilobytes of response body to read
max-size=16

# (int) Follow redirects
; max-redirects=0
