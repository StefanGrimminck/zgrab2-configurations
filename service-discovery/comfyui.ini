# ComfyUI, the node-based Stable Diffusion front end. /system_stats returns
# OS, Python, PyTorch and GPU/VRAM details on the unauthenticated default
# install; a 200 with a "system" JSON object confirms it. Default port 8188.
# /object_info and /models are other unauthenticated ComfyUI routes.
[http]
name="comfyui"
port=8188
endpoint="/system_stats"

# (bool) Retry with HTTPS if the initial request fails
retry-https=true

# (int) Max kilobytes of response body to read
max-size=16
