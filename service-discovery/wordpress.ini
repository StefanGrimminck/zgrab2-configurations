# WordPress. /wp-login.php returns the login form and fingerprints a WordPress site, the
# starting point for plugin-CVE and credential attacks. See the wordpress-xmlrpc and
# wordpress-user-enum misconfiguration configs for the related abuse surfaces.
[http]
name="wordpress"
port=80
endpoint="/wp-login.php"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
