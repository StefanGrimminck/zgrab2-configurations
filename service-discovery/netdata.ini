# Netdata real-time monitoring agent on 19999. /api/v1/info returns host and
# version detail without authentication; the response exposes internal metrics
# and fingerprints the agent.
[http]
name="netdata"
port=19999
endpoint="/api/v1/info"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
