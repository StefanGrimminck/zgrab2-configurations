# Netdata real-time monitoring agent on 19999. /api/v1/info returns host and version detail
# without auth, exposing internal metrics and fingerprinting the agent.
[http]
name="netdata"
port=19999
endpoint="/api/v1/info"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (string) HTTP request method type
; method=GET
