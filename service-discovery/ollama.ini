# Exposed Ollama LLM server. /api/tags lists every model pulled onto an
# unauthenticated instance and needs no credentials, so a 200 with a
# {"models":[...]} body is a wide-open Ollama. Port 11434 is among the most
# probed ports in our honeypot telemetry.
[http]
name="ollama"
port=11434
endpoint="/api/tags"

# (string) HTTP request method type
; method=GET

# (string) Set a custom user-agent
; user-agent="Mozilla/5.0 zgrab/0.x"

# (bool) Retry with HTTPS if the initial request fails (some sit behind a proxy)
retry-https=true

# (int) Max kilobytes of response body to read, enough for the model list
max-size=64

# (int) Follow redirects
; max-redirects=0
