# Ollama LLM server without authentication. /api/tags lists every model
# pulled onto the instance and needs no credentials, so a 200 with a
# {"models":[...]} body is an open Ollama. Default port 11434.
[http]
name="ollama"
port=11434
endpoint="/api/tags"

# (bool) Retry with HTTPS if the initial request fails (some sit behind a proxy)
retry-https=true

# (int) Max kilobytes of response body to read, enough for the model list
max-size=64
