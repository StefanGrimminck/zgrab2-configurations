# Apache Airflow web UI / API. /health returns the scheduler and metadatabase health
# as JSON and fingerprints the instance (surface behind several auth-bypass CVEs).
# Common on 8080.
[http]
name="apache-airflow"
port=8080
endpoint="/health"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
