# Windows Server Update Services. ClientWebService/Client.asmx?singleWsdl returns
# the SOAP service description without authentication and fingerprints a WSUS
# server on its default port. WSUS has also carried unauthenticated deserialization
# RCE (most recently CVE-2025-59287); this probe only reads the WSDL.
[http]
name="wsus"
port=8530
endpoint="/ClientWebService/Client.asmx?singleWsdl"

# WSUS also serves over TLS on 8531
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (string) HTTP request method type
; method=GET
