# Couchbase Server cluster manager. Port 18091 is the TLS-secured cluster manager
# (8091 is the cleartext console); /versions returns JSON with an
# "implementationVersion" field that fingerprints the build. Confirm that marker
# in the response.
[http]
name="couchbase"
port=18091
endpoint="/versions"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
