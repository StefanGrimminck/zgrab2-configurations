# Couchbase Server cluster manager. Port 18091 is the TLS cluster manager
# (8091 is the cleartext console). /versions returns JSON with an
# "implementationVersion" field, the marker that identifies the build.
[http]
name="couchbase"
port=18091
endpoint="/versions"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
