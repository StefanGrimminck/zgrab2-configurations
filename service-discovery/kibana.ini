# Kibana. Port 5601 is the Kibana default; /app/home serves the UI and the
# response carries kbn-name / kbn-version headers that fingerprint the instance.
# Confirm those headers before treating a hit as Kibana.
[http]
name="kibana"
port=5601
endpoint="/app/home"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (string) HTTP request method type
; method=GET
