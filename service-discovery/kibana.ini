# Kibana on its default port 5601. /app/home serves the UI, and the kbn-name
# and kbn-version response headers identify the instance.
[http]
name="kibana"
port=5601
endpoint="/app/home"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
