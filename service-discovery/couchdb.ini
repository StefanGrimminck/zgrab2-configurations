# Apache CouchDB. The root document returns {"couchdb":"Welcome","version":...} with
# no auth and fingerprints the database. CouchDB's 5984 appears in our telemetry.
[http]
name="couchdb"
port=5984
endpoint="/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
