# HashiCorp Consul agent HTTP API. /v1/agent/self returns the full agent config as
# JSON when the API is unauthenticated, a serious exposure as well as a fingerprint.
# Default port 8500.
[http]
name="consul"
port=8500
endpoint="/v1/agent/self"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (string) HTTP request method type
; method=GET
