# HashiCorp Nomad orchestrator on 4646. /v1/agent/health returns agent status; an
# unauthenticated API allows job submission, a known remote code execution path.
[http]
name="nomad"
port=4646
endpoint="/v1/agent/health"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
