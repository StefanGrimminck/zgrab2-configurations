# Zabbix monitoring frontend. /zabbix/index.php returns the Zabbix login and fingerprints
# the version, useful for tracking SQL-injection and auth-bypass CVEs.
[http]
name="zabbix"
port=80
endpoint="/zabbix/index.php"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
