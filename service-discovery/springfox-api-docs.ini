# Springfox Swagger 2 specification of a Spring application. /v2/api-docs is
# the Springfox default path; a 200 JSON body with "swagger":"2.0" lists every
# route and schema of the API. Spring Boot's default port is 8080.
[http]
name="springfox-api-docs"
port=8080
endpoint="/v2/api-docs"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough for the info block
max-size=64
