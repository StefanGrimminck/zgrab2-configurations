# QNAP QTS NAS. /cgi-bin/authLogin.cgi is the QTS auth surface and fingerprints the
# device (behind CVE-2023-23368 and other QTS RCEs). Probed in our telemetry.
[http]
name="qnap-qts"
port=8080
endpoint="/cgi-bin/authLogin.cgi"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Follow redirects
max-redirects=2
# (string) HTTP request method type
; method=GET
