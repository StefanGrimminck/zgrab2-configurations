# QNAP QTS NAS. /cgi-bin/authLogin.cgi is the QTS authentication surface and
# fingerprints the device, the entry point for CVE-2023-23368 and other QTS
# RCEs.
[http]
name="qnap-qts"
port=8080
endpoint="/cgi-bin/authLogin.cgi"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Follow redirects
max-redirects=2
