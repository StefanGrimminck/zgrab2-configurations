# Drupal CMS. /CHANGELOG.txt discloses the exact core version on many installs and
# fingerprints Drupal, the surface behind the Drupalgeddon CVEs.
[http]
name="drupal"
port=80
endpoint="/CHANGELOG.txt"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
