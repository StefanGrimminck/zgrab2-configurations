# Docker Engine remote API over TLS on 2376. /version returns JSON with
# ApiVersion and Version fields; an unauthenticated daemon means full control of
# the host, so this is both a fingerprint and a serious exposure. Confirm the
# ApiVersion marker in the response.
[http]
name="docker-api-tls"
port=2376
endpoint="/version"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
