# F5 BIG-IP Traffic Management UI. /tmui/login.jsp returns the Configuration Utility
# login and fingerprints the device, the surface behind CVE-2020-5902, CVE-2022-1388
# and CVE-2023-46747.
[http]
name="f5-big-ip"
port=443
endpoint="/tmui/login.jsp"

# Service speaks TLS by default
use-https=true
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
