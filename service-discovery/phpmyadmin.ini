# phpMyAdmin. The login page sets pma cookies and embeds 'phpMyAdmin' branding, a
# fingerprint for an exposed DB admin UI and a frequent brute-force target.
[http]
name="phpmyadmin"
port=80
endpoint="/phpmyadmin/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Follow redirects
max-redirects=2
# (string) HTTP request method type
; method=GET
