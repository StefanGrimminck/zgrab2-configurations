# Windows Remote Management (WinRM) / WS-Management listener, default 5985
# (HTTP). A GET to /wsman returns 405 with a 'Server: Microsoft-HTTPAPI/2.0'
# header, a clean fingerprint for an internet-exposed Windows remoting
# endpoint. HTTPS listeners use 5986.
[http]
name="winrm-wsman"
port=5985
endpoint="/wsman"
