# Windows Remote Management (WinRM) / WS-Management listener, default 5985 (HTTP).
# A GET to /wsman returns 405 with a 'Server: Microsoft-HTTPAPI/2.0' header, a
# clean fingerprint for an internet-exposed Windows remoting endpoint. /wsman is
# probed against 5985/5986 in our telemetry.
[http]
name="winrm-wsman"
port=5985
endpoint="/wsman"

# (string) HTTP request method type
; method=GET
