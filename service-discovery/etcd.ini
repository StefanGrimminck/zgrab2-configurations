# etcd key-value store client API. /version returns {"etcdserver":...} without auth
# and fingerprints an exposed etcd (often the backing store for Kubernetes secrets).
# Default client port 2379.
[http]
name="etcd"
port=2379
endpoint="/version"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
