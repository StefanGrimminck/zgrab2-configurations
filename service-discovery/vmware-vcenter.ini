# VMware vCenter Server. /ui/ returns the vSphere Client and fingerprints vCenter, the
# surface behind CVE-2021-21972, CVE-2021-44228 and CVE-2023-34048.
[http]
name="vmware-vcenter"
port=443
endpoint="/ui/"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
