# OpenAPI / Swagger machine-readable spec. /v3/api-docs (springdoc and others) returns the
# full API definition as JSON, enumerating every route and parameter. A 200 containing
# '"openapi"' is a hit.
[http]
name="openapi-spec"
port=80
endpoint="/v3/api-docs"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (string) HTTP request method type
; method=GET
