# HashiCorp Vault, default API port 8200. /v1/sys/health is unauthenticated and
# returns JSON with the Vault version and the sealed / initialized state, a clean
# fingerprint for an internet-exposed secrets manager. 8200 appears in our
# top-probed ports. Vault listeners are TLS by default, so we start with HTTPS.
[http]
name="hashicorp-vault"
port=8200
endpoint="/v1/sys/health"

# Use HTTPS for the initial request (Vault's default listener config)
use-https=true

# (string) HTTP request method type
; method=GET

# (int) Max kilobytes of response body to read
max-size=64

# (int) Follow redirects
; max-redirects=0
