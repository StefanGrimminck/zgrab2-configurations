# HashiCorp Vault, default API port 8200. /v1/sys/health needs no
# authentication and returns JSON with the Vault version and the sealed and
# initialized state, a clean fingerprint for an exposed secrets manager.
# Vault listeners use TLS by default.
[http]
name="hashicorp-vault"
port=8200
endpoint="/v1/sys/health"

# Use HTTPS for the initial request (Vault's default listener config)
use-https=true

# (int) Max kilobytes of response body to read
max-size=64
