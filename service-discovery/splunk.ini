# Splunk Enterprise web UI. /en-US/account/login returns the Splunk login and fingerprints
# the instance, the surface behind several Splunk RCE and path-traversal CVEs. Default 8000.
[http]
name="splunk"
port=8000
endpoint="/en-US/account/login"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
