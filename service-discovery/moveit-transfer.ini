# Progress MOVEit Transfer managed file-transfer server. /human.aspx is the
# end-user web client, served without authentication, and fingerprints the
# product; its documentation link carries a year that hints at the version.
# MOVEit is the surface behind CVE-2023-34362 and CVE-2024-5806. Default port
# 443, also seen on 8443 and 80. The MOVEit Transfer branding confirms a hit.
[http]
name="moveit-transfer"
port=443
endpoint="/human.aspx"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (int) Max number of redirects to follow
max-redirects=2
