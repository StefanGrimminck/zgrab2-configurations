# MinIO S3-compatible object storage. /minio/health/live returns 200 with a
# 'Server: MinIO' header, fingerprinting an exposed object store. Default 9000.
[http]
name="minio"
port=9000
endpoint="/minio/health/live"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=8
# (string) HTTP request method type
; method=GET
