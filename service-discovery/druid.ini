# Apache Druid router on port 8888. /unified-console.html serves the Druid web
# console, and the "Apache Druid" page title marks a hit.
[http]
name="druid"
port=8888
endpoint="/unified-console.html"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
