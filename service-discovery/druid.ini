# Apache Druid router console. Port 8888 is the Druid router; /unified-console.html
# serves the Druid web console and carries the "Apache Druid" page title. Confirm
# that marker in the response before treating a hit as Druid.
[http]
name="druid"
port=8888
endpoint="/unified-console.html"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=32
# (string) HTTP request method type
; method=GET
