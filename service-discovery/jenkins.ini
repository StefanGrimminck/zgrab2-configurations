# Jenkins automation server. The root page carries an 'X-Jenkins: <version>' header
# that fingerprints the instance and version (surface behind CVE-2024-23897). Default 8080.
[http]
name="jenkins"
port=8080
endpoint="/"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Follow redirects
max-redirects=2
# (string) HTTP request method type
; method=GET
