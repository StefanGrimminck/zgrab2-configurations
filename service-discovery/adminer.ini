# Adminer, the single-file database admin tool. /adminer.php returns the
# Adminer login page and identifies the tool, a common foothold when left
# exposed.
[http]
name="adminer"
port=80
endpoint="/adminer.php"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Max number of redirects to follow
max-redirects=2
