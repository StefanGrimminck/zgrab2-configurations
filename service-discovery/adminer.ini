# Adminer single-file DB admin tool. /adminer.php returns the Adminer login and
# fingerprints the tool, a common foothold when left exposed.
[http]
name="adminer"
port=80
endpoint="/adminer.php"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=64
# (int) Follow redirects
max-redirects=2
# (string) HTTP request method type
; method=GET
