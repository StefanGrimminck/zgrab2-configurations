# Ivanti Connect Secure / Pulse Connect Secure SSL VPN. /dana-na/auth/url_default/welcome.cgi
# is the appliance login page and fingerprints the device, the surface behind
# CVE-2023-46805 and CVE-2024-21887.
[http]
name="ivanti-connect-secure"
port=443
endpoint="/dana-na/auth/url_default/welcome.cgi"

# Service speaks TLS by default
use-https=true
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
