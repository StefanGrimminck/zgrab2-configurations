# Model Context Protocol (MCP) server on the streamable HTTP transport. A GET
# to /mcp without an event-stream Accept header gets a 406 JSON-RPC error,
# "Not Acceptable: Client must accept text/event-stream", which only an MCP
# endpoint returns. An open MCP server lets anyone list and call its tools.
# Port 8000 is the Python SDK default; MCP servers are also common on 3000/8080.
[http]
name="mcp-streamable-http"
port=8000
endpoint="/mcp"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, the error object is one line
max-size=4
