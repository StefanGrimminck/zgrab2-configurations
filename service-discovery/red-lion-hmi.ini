# Red Lion Controls HMI web interface. /portal/redlion is a branded route
# specific to the device's web portal and fingerprints the product. Red Lion
# HMI and Crimson-configured devices have a history of weak default
# credentials and path traversal (CVE-2020-27279, CVE-2022-3090,
# CVE-2022-26516).
[http]
name="red-lion-hmi"
port=80
endpoint="/portal/redlion"

# (bool) Retry with HTTPS if the initial request fails
retry-https=true

# (int) Max kilobytes of response body to read
max-size=16
