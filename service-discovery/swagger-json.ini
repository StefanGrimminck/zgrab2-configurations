# Swagger 2.0 specification at /swagger.json. A 200 JSON body with
# "swagger":"2.0" lists every route and schema of the API.
[http]
name="swagger-json"
port=80
endpoint="/swagger.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough for the info block
max-size=64
