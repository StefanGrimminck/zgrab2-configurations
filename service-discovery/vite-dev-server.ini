# Vite development server reachable from the network (started with --host).
# The /@vite/client module only exists on a dev server; a 200 JavaScript body
# containing "[vite] connecting..." confirms it. Exposed dev servers are the
# surface behind CVE-2025-30208, CVE-2025-31125 and CVE-2025-68155. Vite
# listens on 5173.
[http]
name="vite-dev-server"
port=5173
endpoint="/@vite/client"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough to reach the connecting message
max-size=64
