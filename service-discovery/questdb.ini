# QuestDB REST API on 9000. The vendor's documented lightweight health query,
# /exec?query=SELECT 1, returns a distinctive QuestDB JSON envelope
# ({"query":"SELECT 1",...,"dataset":[[1]]}) that fingerprints the database. It
# is read-only. Confirm that JSON shape before treating a hit as QuestDB, since
# port 9000 is shared by several products.
[http]
name="questdb"
port=9000
endpoint="/exec?query=SELECT%201"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
