# Jupyter Notebook / Lab. /api returns {"version":...}; a token-less instance allows
# arbitrary code execution via new notebooks. 8888 is among our top-probed ports.
[http]
name="jupyter"
port=8888
endpoint="/api"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
