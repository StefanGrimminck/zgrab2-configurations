# Adobe Commerce / Magento. /magento_version returns the edition and version string on
# many installs and fingerprints the platform.
[http]
name="magento"
port=80
endpoint="/magento_version"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=8
# (int) Max number of redirects to follow
max-redirects=2
# (string) HTTP request method type
; method=GET
