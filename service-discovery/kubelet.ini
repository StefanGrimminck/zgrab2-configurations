# Kubernetes kubelet read-only/secure API on 10250 (TLS). /healthz returns 'ok' on
# an open kubelet; /pods and /runningpods expose workloads when authz is
# misconfigured. Fingerprints node-level exposure.
[http]
name="kubelet"
port=10250
endpoint="/healthz"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
