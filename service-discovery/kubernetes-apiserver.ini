# Kubernetes API server. /version is commonly readable anonymously and returns the
# build version JSON; even when anonymous auth is off, the 403 fingerprints kube.
# Default secure port 6443 (TLS).
[http]
name="kubernetes-apiserver"
port=6443
endpoint="/version"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=16
# (string) HTTP request method type
; method=GET
