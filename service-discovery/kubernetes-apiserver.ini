# Kubernetes API server. /version is often readable anonymously and returns the
# build version as JSON; with anonymous auth off, the 403 still fingerprints
# Kubernetes. Default secure port 6443 (TLS).
[http]
name="kubernetes-apiserver"
port=6443
endpoint="/version"

# Service speaks TLS by default
use-https=true
# (int) Max kilobytes of response body to read
max-size=16
