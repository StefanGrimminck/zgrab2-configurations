# ClickHouse HTTP interface on 8123. /ping returns 'Ok.' and identifies the
# database. On default installs an open interface accepts SQL over /?query=
# without authentication.
[http]
name="clickhouse"
port=8123
endpoint="/ping"

# Frequently exposed behind TLS as well, retry over HTTPS
retry-https=true
# (int) Max kilobytes of response body to read
max-size=8
