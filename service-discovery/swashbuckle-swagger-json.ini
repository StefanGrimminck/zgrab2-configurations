# ASP.NET Core API specification generated by Swashbuckle.
# /swagger/v1/swagger.json is the Swashbuckle default path; a 200 JSON body
# with an "openapi" version field lists every route and schema of the API.
[http]
name="swashbuckle-swagger-json"
port=80
endpoint="/swagger/v1/swagger.json"

# Also common behind TLS, retry over HTTPS
retry-https=true

# (int) Max kilobytes of response body to read, enough for the info block
max-size=64
