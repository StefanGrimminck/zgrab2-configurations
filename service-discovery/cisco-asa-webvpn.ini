# Cisco ASA / Firepower Threat Defense WebVPN (Clientless SSL VPN) portal. The
# /+CSCOE+/logon.html login page identifies an ASA/FTD appliance, the surface
# behind CVE-2018-0101, CVE-2020-3452 and CVE-2023-20269. Probed directly in our
# honeypot telemetry.
[http]
name="cisco-asa-webvpn"
port=443
endpoint="/+CSCOE+/logon.html"

# Service speaks TLS by default
use-https=true
# (int) Follow redirects
max-redirects=2
# (string) HTTP request method type
; method=GET
