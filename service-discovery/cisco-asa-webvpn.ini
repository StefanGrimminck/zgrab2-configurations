# Cisco ASA and Firepower Threat Defense WebVPN (Clientless SSL VPN) portal.
# The /+CSCOE+/logon.html login page identifies an ASA or FTD appliance, the
# surface behind CVE-2018-0101, CVE-2020-3452 and CVE-2023-20269.
[http]
name="cisco-asa-webvpn"
port=443
endpoint="/+CSCOE+/logon.html"

# Service speaks TLS by default
use-https=true
# (int) Max number of redirects to follow
max-redirects=2
