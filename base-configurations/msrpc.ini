[msrpc]
name="msrpc"
port=135

# (string) Interface UUID to propose in the Bind request
; interface-uuid

# (uint16) Major version of the interface to propose
; interface-version-major

# (uint16) Minor version of the interface to propose
; interface-version-minor

# (uint32) call_id to use in the Bind request
; call-id

# (uint16) max_xmit_frag/max_recv_frag to advertise
; max-frag

# (bool) Output extra connection information
; verbose
