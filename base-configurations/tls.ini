[tls]
name="tls"
port=443

# (string) Server name used for certificate verification and SNI
; server-name

# (bool) Do not send the domain name in the TLS handshake
; no-sni

# (string) Minimum SSL/TLS version that is acceptable
; min-version

# (string) Maximum SSL/TLS version that is acceptable
; max-version

# (string) Comma-delimited list of hex cipher suites to advertise
; cipher-suite

# (bool) Output extra connection information
; verbose
