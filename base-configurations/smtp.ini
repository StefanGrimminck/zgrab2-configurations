[smtp]
name="smtp"
port=25

# (string) Send EHLO with this domain (sends EHLO when set)
; send-ehlo-override="example.com"

# (string) Send HELO with this domain (sends HELO when set)
; send-helo-override="example.com"

# (string) Override the STARTTLS command sent before the TLS handshake
; send-starttls-override

# (bool) Send the HELP command
; send-help

# (bool) Send the QUIT command before exiting
; send-quit

# (bool) Perform an implicit TLS handshake on connect (SMTPS, e.g. port 465)
; smtps

# (bool) Output extra connection information
; verbose
