[amqp091]
name="amqp091"
port=5672

# (string) The vhost to connect to
; vhost=/

# (string) Username for authentication, needs auth-pass too
; auth-user

# (string) Password for authentication, needs auth-user too
; auth-pass

# (bool) Connect over TLS (AMQPS usually listens on 5671)
; use-tls

# (bool) With use-tls, fall back to plain AMQP if TLS fails
; allow-tls-downgrade

# (bool) Output extra connection information
; verbose
